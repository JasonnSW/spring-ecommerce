version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: mysql_store
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: MyPassword!
      MYSQL_DATABASE: store_api
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - store_network

volumes:
  mysql_data:

networks:
  store_network:
